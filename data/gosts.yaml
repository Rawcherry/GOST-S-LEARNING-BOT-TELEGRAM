# Справочник стандартов: порядок здесь = порядок в меню бота.
# cheat — шпаргалка (HTML-разметка Telegram: <b>, <i>), показывается перед тренировкой.
gosts:
  - code: "2.301"
    full: "ГОСТ 2.301-68"
    title: "Форматы"
    emoji: "📄"
    note: "В РФ утверждён ГОСТ Р 2.301-2026; ГОСТ 2.301-68 применяется до 01.10.2027. Вопросы — по ГОСТ 2.301-68 с изм. № 1–3."
    cheat: |
      • Формат определяют размеры <b>внешней рамки</b> (сплошная тонкая).
      • A0 = 1189×841 мм, площадь 1 м². Каждый следующий — деление пополам параллельно меньшей стороне.
      • A1 594×841 · A2 420×594 · A3 297×420 · A4 210×297 · допускается A5 148×210.
      • Дополнительные форматы: короткую сторону увеличивают кратно. A4×3 = 297×630, A4×4 = 297×841, A3×3 = 420×891.
      • Отклонения сторон: до 150 мм ±1,5; 150–600 мм ±2,0; св. 600 мм ±3,0.

  - code: "2.303"
    full: "ГОСТ 2.303-68"
    title: "Линии"
    emoji: "✏️"
    note: "В РФ утверждён ГОСТ Р 2.303-2026, текст пока не опубликован. Вопросы — по ГОСТ 2.303-68 с изм. № 1–3."
    cheat: |
      • Сплошная толстая основная <b>s = 0,5…1,4 мм</b> — видимый контур.
      • Тонкие (сплошная, волнистая, штриховая, штрихпунктирная, с изломами, с двумя точками) — <b>s/3…s/2</b>.
      • Штрихпунктирная утолщённая — s/2…2s/3: поверхности под термообработку/покрытие.
      • Разомкнутая — <b>s…1,5s</b>: линии сечений.
      • Штрихпунктирные пересекаются и заканчиваются <b>штрихами</b>; центровые при ⌀ менее <b>12 мм</b> — сплошные тонкие.
      • Толщина линий одного типа одинакова для всех изображений одного масштаба.

  - code: "2.305"
    full: "ГОСТ 2.305-2008"
    title: "Виды, разрезы, сечения"
    emoji: "🔪"
    note: "В РФ утверждён ГОСТ Р 2.305-2026, текст пока не опубликован. Вопросы — по ГОСТ 2.305-2008."
    cheat: |
      • Главный вид — на фронтальной плоскости. Вид сверху — под главным, слева — справа от главного, справа — слева, снизу — над главным, сзади — справа от вида слева.
      • <b>Разрез</b>: то, что в секущей плоскости и за ней. <b>Сечение</b>: только то, что в плоскости.
      • Линия сечения — разомкнутая, стрелки в 2–3 мм от внешнего конца штриха, надпись «А–А».
      • Половину вида и половину разреза разделяют осью симметрии.
      • Наложенное сечение — тонкий контур; вынесенное — основной.
      • В продольном разрезе не рассекают винты, шпонки, сплошные валы; рёбра жёсткости не штрихуют.
      • Выносной элемент: тонкая окружность, буква на полке, над ним «Б (4:1)».

  - code: "2.306"
    full: "ГОСТ 2.306-68"
    title: "Штриховка материалов"
    emoji: "🧱"
    note: "Заменяется ГОСТ Р 2.306-2026 (приказ № 1038-ст); ГОСТ 2.306-68 применяется до 01.10.2027."
    cheat: |
      • Металлы — наклонные линии под <b>45°</b>; неметаллы (резина, пластмасса) — <b>«в клетку»</b>.
      • Если 45° совпадает с контуром или осью — <b>30° или 60°</b>.
      • Шаг штриховки <b>1–10 мм</b>; на всех сечениях одной детали — одинаковый наклон и шаг.
      • Смежные детали — встречная штриховка, либо иной шаг, либо сдвиг линий.
      • Сечения уже <b>2 мм</b> можно зачернять, просвет между смежными — не менее <b>0,8 мм</b>.
      • Композиционные материалы с металлом обозначают как металлы. Стекло — 15–20°.

  - code: "2.307"
    full: "ГОСТ 2.307-2011"
    title: "Размеры и отклонения"
    emoji: "📏"
    note: "Действует. Готовится ГОСТ Р 2.307 (проект), пока не утверждён."
    cheat: |
      • Размеры — в мм без обозначения единицы; углы — в °, ′, ″ с обозначением.
      • От контура до размерной линии — не менее <b>10 мм</b>, между параллельными размерными — не менее <b>7 мм</b>.
      • Выносные линии выходят за стрелки на <b>1–5 мм</b>.
      • Число — над размерной линией, ближе к середине. Линии контура и осевые размерными быть не могут.
      • Замкнутую цепь не наносят: один размер делают справочным «*».
      • Нулевое отклонение не пишут; симметричное — одно число со знаком ±.
      • Количество одинаковых отверстий указывают всегда.

  - code: "2.104"
    full: "ГОСТ Р 2.104-2023"
    title: "Основные надписи"
    emoji: "🗂"
    note: "Действует в РФ с 01.03.2024 вместо ГОСТ 2.104-2006 (а тот заменил ГОСТ 2.104-68)."
    cheat: |
      • Форма 1 — чертежи и схемы; форма 2 — первый лист текстовых КД; форма 2а — последующие листы.
      • Графы: 1 — наименование, 2 — обозначение, 3 — материал (на чертежах деталей), 4 — литера, 5 — масса, 6 — масштаб, 7 — лист, 8 — листов, 9 — организация.
      • Графа 10 — характер работы: обязательны «Разраб.» и «Н. контр.».
      • Графы 14–18 — изменения; 26 — обозначение, повёрнутое на 180° (только графические КД).
      • Поля: слева 20 мм, остальные 5 мм. Дата: ДД.ММ.ГГГГ.
      • Зоны: цифры справа налево, латинские буквы снизу вверх.

  - code: "2.105"
    full: "ГОСТ Р 2.105-2019"
    title: "Текстовые документы"
    emoji: "📝"
    note: "Действует с 01.02.2020 (изм. № 1 и № 2). Заменил ГОСТ 2.105-95."
    cheat: |
      • От рамки до текста по бокам — не менее 3 мм, до верхней/нижней строки — не менее 10 мм; абзац — 5 знаков.
      • Разделы — арабскими цифрами без точки в конце; заголовки без точки и переносов.
      • Перечисление: двоеточие, дефисы, строчные буквы, «;», в конце «.».
      • «Таблица 1 — Название» над таблицей; «Рисунок 1 — Название» под рисунком.
      • Формула: пояснения начинаются со слова «где» без двоеточия; номер (1) справа.
      • Приложения: А, Б, В… кроме Ё, З, Й, О, Ч, Ь, Ы, Ъ.
      • В тексте: «минус», «диаметр» вместо знаков; «от 15 % до 30 %».

  - code: "2.311"
    full: "ГОСТ 2.311-68"
    title: "Изображение резьбы"
    emoji: "🔩"
    note: "Действует (изм. № 1)."
    cheat: |
      • На стержне: наружный ⌀ — основная, внутренний — тонкая. В отверстии — наоборот.
      • Тонкая линия — не ближе 0,8 мм к основной и не дальше шага резьбы.
      • С торца — тонкая дуга около <b>3/4 окружности</b>, разомкнутая в любом месте; фаски не показывают.
      • Граница резьбы — основная линия до наружного диаметра; сбег — тонкая.
      • Штриховку доводят до сплошной основной линии.
      • В соединении в отверстии видна только часть резьбы, не закрытая стержнем.
      • Обозначение резьбы — по наружному диаметру (кроме конической и трубной цилиндрической).

  - code: "2.313"
    full: "ГОСТ 2.313-82"
    title: "Неразъёмные соединения"
    emoji: "🧷"
    note: "Действует. Клёпка, пайка, склеивание, сшивание, металлические скобки. Сварка — по ГОСТ 2.312."
    cheat: |
      • Место пайки или склеивания — линия толщиной <b>2s</b>.
      • Условный знак наносят на линии-выноске: пайка — черт. 4, склеивание — буква «К» (черт. 5).
      • Шов по замкнутой линии — окружность ⌀3–5 мм на изломе выноски.
      • Марку припоя/клея — в технических требованиях, на полке — номер пункта.
      • Одинаковые заклёпки показывают в 1–2 местах, остальные — осевыми.

  - code: "2.315"
    full: "ГОСТ 2.315-68"
    title: "Крепёжные детали"
    emoji: "⚙️"
    note: "Действует (изм. № 1, 2)."
    cheat: |
      • Упрощённые и условные изображения — на сборочных чертежах и чертежах общих видов.
      • Выбор зависит от назначения и масштаба; при ⌀ стержня на чертеже <b>2 мм и менее</b> — условно.
      • Однотипные соединения — в 1–2 местах, остальные — центровыми/осевыми.
      • Шлиц — одной линией: на одном виде по оси, на другом — под <b>45° к рамке</b>.

  - code: "2.402"
    full: "ГОСТ 2.402-68"
    title: "Зубчатые колёса"
    emoji: "🛞"
    note: "Действует."
    cheat: |
      • Вершины зубьев — сплошная основная; делительные (начальные) — штрихпунктирная тонкая.
      • Впадины в разрезе — основная; на виде допускается сплошная тонкая.
      • При плоскости через ось зубья не рассекают.
      • В зацеплении зуб ведущего колеса — перед зубом ведомого; виток червяка — перед зубом колеса.
      • Направление зубьев — три тонкие линии. Цепь — штрихпунктирная тонкая.
