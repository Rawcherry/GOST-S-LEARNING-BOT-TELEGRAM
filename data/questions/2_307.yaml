# ГОСТ 2.307-2011 «Нанесение размеров и предельных отклонений»
- id: "307-01"
  gost: "2.307"
  ref: "ГОСТ 2.307-2011, п. 5.11"
  image: "307_layout.png"
  q: "Минимальное расстояние «а» от линии контура до размерной линии?"
  options: ["10 мм", "7 мм", "5 мм", "15 мм"]
  answer: 0
  explain: "Между размерной линией и линией контура — не менее 10 мм; между параллельными размерными линиями — не менее 7 мм."

- id: "307-02"
  gost: "2.307"
  ref: "ГОСТ 2.307-2011, п. 5.11"
  image: "307_layout.png"
  q: "Минимальное расстояние «б» между параллельными размерными линиями?"
  options: ["7 мм", "10 мм", "5 мм", "3 мм"]
  answer: 0
  explain: "Не менее 7 мм. Конкретное значение выбирают по размерам изображения и насыщенности чертежа."

- id: "307-03"
  gost: "2.307"
  ref: "ГОСТ 2.307-2011, п. 5.10"
  image: "307_layout.png"
  q: "На сколько выносные линии выходят за концы стрелок («в»)?"
  options: ["1–5 мм", "0–1 мм", "5–10 мм", "Ровно 2 мм"]
  answer: 0
  explain: "Выносные линии должны выходить за концы стрелок размерной линии на 1–5 мм."

- id: "307-04"
  gost: "2.307"
  ref: "ГОСТ 2.307-2011, п. 6.6"
  image: "307_tol.png"
  q: "Какая запись предельных отклонений НЕ соответствует ГОСТ?"
  options: ["А", "Б", "В", "Г"]
  answer: 1
  fixed: true
  explain: "Нулевое отклонение не указывают (Б — ошибка, правильно как В). Симметричное — один раз со знаком ± (А). Г — поле допуска с числами в скобках."

- id: "307-05"
  gost: "2.307"
  ref: "ГОСТ 2.307-2011, п. 6.3"
  image: "307_tol.png"
  q: "Как называется способ записи Г — 18H7(+0,018)?"
  options:
    - "Обозначение поля допуска с числовым значением в скобках"
    - "Только числовые значения отклонений"
    - "Только обозначение поля допуска"
    - "Посадка в сборе"
  answer: 0
  explain: "Три способа: полем допуска (18H7), числами (18⁺⁰’⁰¹⁸) и полем допуска с числами в скобках справа (18H7(+0,018))."
  level: 2

- id: "307-06"
  gost: "2.307"
  ref: "ГОСТ 2.307-2011, пп. 4.4 а), 4.13"
  image: "307_chain.png"
  q: "Что неправильно в нанесении размеров?"
  options:
    - "Замкнутая цепь — один размер надо сделать справочным «*»"
    - "Нет размера высоты ступеней"
    - "Габарит надо ставить ближе к контуру"
    - "Всё правильно"
  answer: 0
  explain: "Размеры не наносят в виде замкнутой цепи, кроме случая, когда один из них указан как справочный (без отклонений)."

- id: "307-07"
  gost: "2.307"
  ref: "ГОСТ 2.307-2011, п. 4.7"
  q: "В каких единицах указывают линейные размеры на чертеже?"
  options:
    - "В миллиметрах без обозначения единицы"
    - "В миллиметрах с обозначением «мм»"
    - "В сантиметрах"
    - "В любых, указав в основной надписи"
  answer: 0
  explain: "Линейные размеры и отклонения — в миллиметрах без обозначения единицы. В технических требованиях единицу указывают."

- id: "307-08"
  gost: "2.307"
  ref: "ГОСТ 2.307-2011, п. 4.3"
  q: "Как отмечают справочные размеры?"
  options:
    - "Знаком «*» и записью «*Размеры для справок» в ТТ"
    - "Заключают в рамку"
    - "Подчёркивают"
    - "Пишут в скобках"
  answer: 0
  explain: "Справочные размеры отмечают «*», а в технических требованиях пишут «*Размеры для справок». Подчёркивают — размер элемента, изображённого не в масштабе (п. 4.16)."

- id: "307-09"
  gost: "2.307"
  ref: "ГОСТ 2.307-2011, п. 5.46"
  image: "307_holes.png"
  q: "Нужны ли угловые размеры между отверстиями, равномерно расположенными по окружности?"
  options:
    - "Нет, указывают только количество"
    - "Да, между каждыми двумя"
    - "Да, один угол 90°"
    - "Да, от горизонтальной оси"
  answer: 0
  explain: "Для одинаковых элементов, равномерно расположенных по окружности, угловые размеры не наносят — указывают их количество."

- id: "307-10"
  gost: "2.307"
  ref: "ГОСТ 2.307-2011, п. 5.47"
  q: "Два симметричных одинаковых отверстия. Нужно ли указывать их количество?"
  options:
    - "Да, количество отверстий указывают всегда"
    - "Нет, симметричные элементы — один раз без количества"
    - "Только на сборочных чертежах"
    - "Только если их больше двух"
  answer: 0
  explain: "Два симметричных элемента (кроме отверстий) указывают один раз без количества. Количество одинаковых отверстий указывают всегда полностью."
  level: 2

- id: "307-11"
  gost: "2.307"
  ref: "ГОСТ 2.307-2011, п. 5.44, рис. 56"
  image: "307_chamfer.png"
  q: "Как записать размер «?» фаски 3 мм под 45°?"
  options: ["3×45°", "45°×3", "Фаска 3", "3/45°"]
  answer: 0
  explain: "Фаски под 45° обозначают по рис. 56 записью «катет × 45°», например 3×45°."

- id: "307-12"
  gost: "2.307"
  ref: "ГОСТ 2.307-2011, п. 5.44"
  q: "Как указывают фаску под углом 30°?"
  options:
    - "Линейным и угловым размерами или двумя линейными"
    - "Записью 2×30°"
    - "Только в технических требованиях"
    - "Так же, как фаску 45°"
  answer: 0
  explain: "Фаски под другими углами указывают по общим правилам: линейным и угловым размерами или двумя линейными. Запись «2×30°» не предусмотрена."
  level: 2

- id: "307-13"
  gost: "2.307"
  ref: "ГОСТ 2.307-2011, п. 5.40"
  image: "307_signs.png"
  q: "Что означает знак перед числом у изображения 1?"
  options: ["Квадрат со стороной 16", "Площадь 16 мм²", "Плоскость", "Справочный размер"]
  answer: 0
  explain: "Знак «□» — размер квадрата; его высота равна высоте размерных чисел."

- id: "307-14"
  gost: "2.307"
  ref: "ГОСТ 2.307-2011, п. 5.41"
  image: "307_signs.png"
  q: "Изображение 2: куда направлен острый угол знака конусности?"
  options: ["К вершине конуса", "К основанию конуса", "Вверх", "Не имеет значения"]
  answer: 0
  explain: "Знак конусности располагают так, чтобы его острый угол был направлен к вершине конуса."

- id: "307-15"
  gost: "2.307"
  ref: "ГОСТ 2.307-2011, п. 5.39"
  image: "307_signs.png"
  q: "Изображение 3 — сферический конец. Нужна ли надпись «Сфера»?"
  options:
    - "Нет, ставят R или ⌀; «Сфера» — если трудно отличить"
    - "Да, всегда"
    - "Да, вместо знака R"
    - "Нет, сферу размером не обозначают"
  answer: 0
  explain: "Перед размерным числом диаметра или радиуса сферы ставят ⌀ или R без надписи «Сфера»; если сферу трудно отличить от других поверхностей, допускается слово «Сфера» или знак."
