- id: "307-16"
  gost: "2.307"
  ref: "ГОСТ 2.307-2011, п. 5.22"
  image: "307_ticks.png"
  q: "Допускается ли заменять стрелки засечками (А) и точками (Б)?"
  options:
    - "Да, в цепочке, если мало места для стрелок"
    - "Нет, только стрелки"
    - "Только засечки"
    - "Только на строительных чертежах"
  answer: 0
  explain: "Если на размерных линиях, расположенных цепочкой, мало места, стрелки заменяют засечками под 45° или чётко нанесёнными точками."

