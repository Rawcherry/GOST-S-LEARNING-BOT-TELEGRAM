  ref: "ГОСТ 2.307-2011, п. 5.24"
  q: "Где наносят размерное число?"
  options:
    - "Над размерной линией, возможно ближе к середине"
    - "В разрыве размерной линии"
    - "Под размерной линией"
    - "У левой стрелки"
  answer: 0
  explain: "Размерные числа наносят над размерной линией возможно ближе к её середине."

- id: "307-18"
  gost: "2.307"
  ref: "ГОСТ 2.307-2011, п. 6.5"
  q: "Как указывают предельные отклонения угловых размеров?"
  options:
    - "Только числовыми значениями"
    - "Полями допусков"
    - "Квалитетом"
    - "Любым способом"
  answer: 0
  explain: "Предельные отклонения угловых размеров указывают только числовыми значениями, например 30°±10′."
  level: 2

- id: "307-19"
  gost: "2.307"
  ref: "ГОСТ 2.307-2011, п. 5.13"
  q: "Можно ли использовать линию контура или осевую как размерную?"
  options: ["Нет", "Да, если не хватает места", "Да, осевую можно", "Только на сборочных"]
  answer: 0
  explain: "Линии контура, осевые, центровые и выносные линии использовать в качестве размерных не допускается."

- id: "307-20"
  gost: "2.307"
  ref: "ГОСТ 2.307-2011, п. 5.31"
  q: "Что делают со штриховкой и осевыми в месте нанесения размерного числа?"
  options: ["Прерывают", "Оставляют, число пишут поверх", "Утолщают", "Переносят число на полку"]
  answer: 0
  explain: "Размерные числа не допускается разделять или пересекать линиями: осевые, центровые и штриховку в месте числа прерывают."
  level: 2
