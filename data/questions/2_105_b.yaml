  q: "Как правильно закончить фразу в тексте: «Размеры указаны в …»?"
  options: ["миллиметрах", "мм", "мм.", "mm"]
  answer: 0
  explain: "Обозначения единиц без цифр в тексте не сокращают. Исключения — головки и боковики таблиц и расшифровки обозначений в формулах и на рисунках."
  level: 1

