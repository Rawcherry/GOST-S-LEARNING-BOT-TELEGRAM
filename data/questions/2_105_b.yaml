# ГОСТ Р 2.105-2019 «Общие требования к текстовым документам» — дополнительный набор (105-101…105-150)
- id: "105-101"
  gost: "2.105"
  ref: "ГОСТ Р 2.105-2019, п. 5.1.1"
  q: "Какое сочетание кеглей «основной текст / таблица» соответствует рекомендации стандарта при наборе на компьютере?"
  options: ["14 / 12 пт", "16 / 14 пт", "10 / 9 пт", "14 / 9 пт"]
  answer: 0
  explain: "Основной текст рекомендуется набирать кеглем 11–14 пт, а таблицы, примечания, сноски, приложения и примеры — на 1–2 пт меньше. 16 и 10 пт вне диапазона, 9 пт при 14 — меньше на 5 пт."
  level: 2

- id: "105-102"
