  ref: "ГОСТ Р 2.105-2019, п. 5.1.2"
  q: "Какой межстрочный интервал стандарт рекомендует для текстовых документов?"
  options: ["Полуторный", "Одинарный", "Двойной", "1,15"]
  answer: 0
  explain: "Рекомендуется полуторный интервал. Допускаются также 1; 1,15; 1,25; 1,75 и 2."
  level: 1

- id: "105-103"
  gost: "2.105"
  ref: "ГОСТ Р 2.105-2019, п. 5.1.5"
  q: "Как исправить опечатку в бумажном экземпляре ТУ на пыльник?"
  options:
    - "Подчистить или закрасить корректором и написать верный текст на том же месте"
    - "Зачеркнуть и написать верный текст над строкой"
    - "Наклеить поверх полоску с исправленным текстом"
    - "Оставить как есть и дать исправление в сноске"
  answer: 0
  explain: "Опечатки исправляют подчисткой или закрашиванием белой краской и нанесением исправленного текста на том же месте. Помарки и следы не полностью удалённого текста не допускаются."
  level: 1

- id: "105-104"
  gost: "2.105"
  ref: "ГОСТ Р 2.105-2019, п. 5.2.4"
  q: "Какая фраза в тексте документа написана с нарушением стандарта?"
  options:
    - "№ чертежа указан в спецификации"
    - "Температура хрупкости резины — минус 50 °С"
    - "Диаметр втулки — 12 мм"
    - "Усадка резины — 1,5 %"
  answer: 0
  explain: "В тексте не применяют знаки № и % без цифр — пишут «номер», «процент». С цифрами («1,5 %») знак допустим; вместо «−» и «⌀» в тексте пишут «минус» и «диаметр»."
  level: 2

- id: "105-105"
