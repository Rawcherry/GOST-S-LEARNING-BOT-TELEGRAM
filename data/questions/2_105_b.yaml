  ref: "ГОСТ Р 2.105-2019, п. 5.2.4"
  q: "В ТУ на манжету написано: «Резиновая смесь — по ГОСТ». Что здесь нарушено?"
  options:
    - "Индекс стандарта указан без регистрационного номера"
    - "Слово «ГОСТ» нужно писать строчными буквами"
    - "Ссылки на стандарты в ТУ не допускаются"
    - "Наименование стандарта нужно вынести в сноску"
  answer: 0
  explain: "В тексте не допускается применять индексы стандартов (ГОСТ, ОСТ, СТО) без регистрационного номера: нужно указать полное обозначение стандарта с номером."
  level: 2

