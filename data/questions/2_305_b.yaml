  gost: "2.305"
  ref: "ГОСТ 2.305-2008, п. 3.2"
  q: "Как ГОСТ 2.305 определяет термин «вид»?"
  options:
    - "Ортогональная проекция обращённой к наблюдателю видимой части поверхности предмета"
    - "Ортогональная проекция фигуры, получающейся в секущей плоскости"
    - "Ортогональная проекция мысленно рассечённого предмета"
    - "Отдельное, обычно увеличенное, изображение части предмета"
  answer: 0
  explain: "Вид — проекция видимой части поверхности, обращённой к наблюдателю. Фигура в секущей плоскости — сечение, рассечённый предмет — разрез, увеличенная часть — выносной элемент."
  level: 1

