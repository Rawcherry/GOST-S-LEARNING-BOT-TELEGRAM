# ГОСТ 2.305-2008 «Изображения — виды, разрезы, сечения», дополнительный набор (305-101…305-155)
# Порядок: термины (разд. 3) → основные положения (разд. 4) → виды (5) → разрезы (6) → сечения (7)
# → выносные элементы (8) → условности и упрощения (9).

# ---------- Термины (разд. 3) ----------
