    - "Чтобы уменьшить формат чертежа"
  answer: 0
  explain: "Разрез — ортогональная проекция предмета, мысленно рассечённого полностью или частично одной или несколькими плоскостями, для выявления его невидимых поверхностей."
  level: 1

