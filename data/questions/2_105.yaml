# ГОСТ Р 2.105-2019 «Общие требования к текстовым документам»
- id: "105-01"
  gost: "2.105"
  ref: "ГОСТ Р 2.105-2019, п. 6.10.1"
  image: "105_formula.png"
  q: "В каком варианте пояснение символов формулы оформлено правильно?"
  options: ["А", "Б", "В"]
  answer: 1
  fixed: true
  explain: "Пояснения дают под формулой, первая строка начинается со слова «где» без двоеточия, со строчной буквы."

- id: "105-02"
  gost: "2.105"
  ref: "ГОСТ Р 2.105-2019, п. 6.10.4"
  image: "105_formula.png"
  q: "Как нумеруют формулы?"
  options:
    - "Арабскими цифрами в круглых скобках справа"
    - "Римскими цифрами слева"
    - "Арабскими цифрами с точкой справа"
    - "Формулы не нумеруют"
  answer: 0
  explain: "Формулы нумеруют арабскими цифрами в круглых скобках в крайнем правом положении, например (1); в приложениях — (В.1)."

- id: "105-03"
  gost: "2.105"
  ref: "ГОСТ Р 2.105-2019, п. 6.8.1"
  image: "105_table.png"
  q: "Какой вариант оформления наименования таблицы правильный?"
  options: ["А", "Б", "В"]
  answer: 0
  fixed: true
  explain: "Наименование помещают над таблицей: «Таблица 1 — Наименование» (номер и название через тире)."

- id: "105-04"
  gost: "2.105"
  ref: "ГОСТ Р 2.105-2019, п. 6.9.4"
  image: "105_figure.png"
  q: "Какая подпись рисунка правильная?"
  options: ["А", "Б", "В"]
  answer: 1
  fixed: true
  explain: "Слово «Рисунок», номер и наименование через тире помещают под рисунком: «Рисунок 1 — Пыльник»."

- id: "105-05"
  gost: "2.105"
  ref: "ГОСТ Р 2.105-2019, пп. 6.7.1, 6.7.4"
  image: "105_list.png"
  q: "Какое перечисление оформлено правильно?"
  options: ["А", "Б", "В"]
  answer: 0
  fixed: true
  explain: "Перед перечислением — двоеточие; элементы со строчной буквы через «;», последний — с точкой; маркеры — дефисы."

- id: "105-06"
  gost: "2.105"
  ref: "ГОСТ Р 2.105-2019, п. 6.3.5"
  image: "105_appendix.png"
  q: "Какой из этих букв НЕЛЬЗЯ обозначить приложение?"
  options: ["З", "Ж", "И", "К"]
  answer: 0
  explain: "Не используют буквы Ё, З, Й, О, Ч, Ь, Ы, Ъ. Из латиницы — кроме I и O."

- id: "105-07"
  gost: "2.105"
  ref: "ГОСТ Р 2.105-2019, п. 6.3.5"
  q: "Как обозначают единственное приложение?"
  options: ["Приложение А", "Приложение 1", "Приложение", "Приложение I"]
  answer: 0
  explain: "Приложения обозначают прописными буквами, начиная с А; единственное — «Приложение А»."

- id: "105-08"
  gost: "2.105"
  ref: "ГОСТ Р 2.105-2019, п. 5.1.3"
  image: "105_margins.png"
  q: "Минимальное расстояние «а» от рамки до границы текста в начале строк?"
  options: ["3 мм", "10 мм", "5 мм", "1 мм"]
  answer: 0
  explain: "От рамки до границ текста в начале и конце строк — не менее 3 мм; до верхней или нижней строки — не менее 10 мм."

- id: "105-09"
  gost: "2.105"
  ref: "ГОСТ Р 2.105-2019, п. 5.1.3"
  image: "105_margins.png"
  q: "Минимальное расстояние «б» от рамки до верхней строки текста?"
  options: ["10 мм", "3 мм", "5 мм", "15 мм"]
  answer: 0
  explain: "От верхней или нижней строки текста до рамки — не менее 10 мм."

- id: "105-10"
  gost: "2.105"
  ref: "ГОСТ Р 2.105-2019, п. 5.1.4"
  q: "Каким должен быть абзацный отступ?"
  options: ["5 знаков (12,5–17 мм)", "3 знака (7,5 мм)", "10 мм", "На усмотрение автора"]
  answer: 0
  explain: "Абзацный отступ равен пяти знакам (12,5–17 мм) и одинаков по всему тексту."
  level: 2

- id: "105-11"
  gost: "2.105"
  ref: "ГОСТ Р 2.105-2019, п. 5.2.4"
  q: "Как в тексте записать отрицательную температуру?"
  options: ["минус 40 °С", "−40 °С", "-40°С", "40 °С ниже нуля"]
  answer: 0
  explain: "В тексте (кроме формул, таблиц и рисунков) знак «−» перед отрицательными значениями не применяют — пишут слово «минус»."

- id: "105-12"
  gost: "2.105"
  ref: "ГОСТ Р 2.105-2019, п. 5.2.4"
  q: "Как в тексте указать диаметр отверстия?"
  options: ["диаметр 12 мм", "⌀12 мм", "Д12", "Ø 12"]
  answer: 0
  explain: "В тексте вместо знака ⌀ пишут слово «диаметр». Знак ставят только при размерах на чертежах, помещённых в текст."
  level: 2

- id: "105-13"
  gost: "2.105"
  ref: "ГОСТ Р 2.105-2019, п. 6.8.7"
  q: "Что пишут над второй частью перенесённой таблицы?"
  options:
    - "«Продолжение таблицы 3» (головку повторяют)"
    - "«Таблица 3» ещё раз с наименованием"
    - "Ничего, продолжают без головки"
    - "«Окончание»"
  answer: 0
  explain: "Слово «Таблица» с номером пишут один раз; над остальными частями — «Продолжение таблицы …». При подготовке программными средствами эту надпись допускается не писать."
  level: 2

- id: "105-14"
