  ref: "ГОСТ Р 2.105-2019, п. 6.8.8"
  q: "Допускается ли в таблице графа «№ п/п»?"
  options:
    - "Да, строки можно нумеровать в графе «№ п/п»"
    - "Нет, не допускается"
    - "Только в приложениях"
    - "Только в спецификациях"
  answer: 0
  explain: "В ГОСТ Р 2.105-2019 строки можно нумеровать в графе «№ п/п» или в первой графе. Запрет был в старом ГОСТ 2.105-95."
  level: 3

- id: "105-15"
  gost: "2.105"
  ref: "ГОСТ Р 2.105-2019, п. 6.6.2"
  q: "Как оформляют заголовки разделов?"
  options:
    - "С прописной, без точки в конце, без переносов"
    - "Прописными буквами с точкой"
    - "С подчёркиванием"
    - "Курсивом с двоеточием"
  answer: 0
  explain: "Заголовки — с прописной буквы, без точки в конце, полужирным, без подчёркивания; переносы не допускаются."

- id: "105-16"
  gost: "2.105"
  ref: "ГОСТ Р 2.105-2019, п. 6.5.4"
  q: "Как правильно записать номер подраздела?"
  options: ["3.2", "3.2.", "3-2", "III.2"]
  answer: 0
  explain: "Номера разделов и подразделов — арабскими цифрами через точку, в конце номера точку не ставят."

- id: "105-17"
