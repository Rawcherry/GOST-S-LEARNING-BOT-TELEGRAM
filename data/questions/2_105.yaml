  q: "Как записать диапазон в процентах?"
  options: ["от 15 % до 30 %", "от 15 до 30 %", "15–30 %", "15 % – 30 %"]
  answer: 0
  explain: "В диапазоне единицу пишут после последнего числа, но «%» и «°С» повторяют при каждом числе."
